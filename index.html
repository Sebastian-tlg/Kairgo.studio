<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kairgo Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root{
    --bg:#0b0a0e;
    --bg-raise:#141319;
    --card:rgba(255,255,255,0.035);
    --card-strong:rgba(255,255,255,0.06);
    --border:rgba(255,255,255,0.09);
    --border-strong:rgba(255,255,255,0.20);
    --ink:#eeeae3;
    --ink-dim:#9a93a8;
    --ink-faint:#5b5566;
    --violet:#9b87f5;
    --violet-2:#7c65e8;
    --violet-deep:#4f3aa8;
    --violet-glow:rgba(155,135,245,0.35);
    --clay:#d9a889;
    --radius-lg:26px;
    --radius-md:16px;
    --radius-sm:10px;
    --f-serif:'Instrument Serif',Georgia,serif;
    --f-sans:'Bricolage Grotesque',system-ui,sans-serif;
    --f-body:'Manrope',system-ui,sans-serif;
    --f-mono:'Space Mono',ui-monospace,monospace;
    --nav-h:84px;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  section{scroll-margin-top:var(--nav-h);}
  h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-0.01em;}
  p{margin:0;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit;}
  .container{max-width:1240px;margin:0 auto;padding:0 32px;}
  .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;}
  .serif-i{font-family:var(--f-serif);font-style:italic;font-weight:400;}
  .sans-black{font-family:var(--f-sans);font-weight:800;}
  .violet{color:var(--violet);}
  .noise{
    position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;mix-blend-mode:overlay;
    background-image:radial-gradient(rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size:3px 3px;
  }
  .bg-glow{
    position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(45vw 40vw at 88% 6%, rgba(155,135,245,0.16), transparent 65%),
      radial-gradient(50vw 45vw at 4% 40%, rgba(155,135,245,0.08), transparent 65%),
      var(--bg);
  }
  .eyebrow{
    font-family:var(--f-mono);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--ink-dim);display:inline-flex;align-items:center;gap:9px;
  }
  .idx{
    font-family:var(--f-mono);font-size:12px;color:var(--ink-faint);letter-spacing:0.08em;
    display:flex;align-items:center;gap:10px;margin-bottom:20px;
  }
  .idx::before{content:"";width:26px;height:1px;background:var(--border-strong);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:9px;
    padding:15px 26px;border-radius:999px;font-weight:600;font-size:13.5px;
    font-family:var(--f-mono);letter-spacing:0.03em;text-transform:uppercase;
    transition:transform .3s cubic-bezier(.16,.8,.3,1), box-shadow .3s ease, background .3s ease, border-color .3s ease;
    white-space:nowrap;border:1px solid transparent;
  }
  .btn:active{transform:scale(0.96);}
  .btn-solid{background:var(--ink);color:var(--bg);}
  .btn-solid:hover{background:var(--violet);color:#0b0a0e;transform:translateY(-2px);box-shadow:0 14px 34px -12px var(--violet-glow);}
  .btn-line{border-color:var(--border-strong);color:var(--ink);background:rgba(255,255,255,0.02);}
  .btn-line:hover{border-color:var(--violet);color:var(--violet);transform:translateY(-2px);}
  .btn-wa{background:var(--violet);color:#0b0a0e;}
  .btn-wa:hover{background:var(--ink);transform:translateY(-2px);box-shadow:0 14px 34px -12px var(--violet-glow);}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);}
  .focus-ring:focus-visible{outline:2px solid var(--violet);outline-offset:3px;border-radius:6px;}

  @keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}
  @keyframes floatY2{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(10px) rotate(-3deg);}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(26px);}to{opacity:1;transform:translateY(0);}}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  @keyframes bounce{0%,100%{transform:translateY(0);opacity:.5;}50%{transform:translateY(8px);opacity:1;}}
  @keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:0;}}
  @keyframes marquee{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  @keyframes dotBounce{0%,80%,100%{transform:translateY(0);opacity:.4;}40%{transform:translateY(-4px);opacity:1;}}
  @keyframes ping{0%{box-shadow:0 0 0 0 var(--violet-glow);}70%{box-shadow:0 0 0 10px rgba(155,135,245,0);}100%{box-shadow:0 0 0 0 rgba(155,135,245,0);}}

  .reveal{opacity:0;transform:translateY(30px);transition:opacity .8s cubic-bezier(.16,.8,.3,1), transform .8s cubic-bezier(.16,.8,.3,1);}
  .reveal.in{opacity:1;transform:translateY(0);}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
    .reveal{opacity:1;transform:none;}
  }

  ::selection{background:var(--violet);color:#0b0a0e;}
  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.14);border-radius:99px;}
</style>

/* ------------------------------- Scroll reveal ------------------------------ */
function Reveal({ children, delay = 0, className = "", as: As = "div" }) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      (entries) => entries.forEach((e) => { if (e.isIntersecting) { setInView(true); io.disconnect(); } }),
      { threshold: 0.14 }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return (
    <As ref={ref} className={"reveal " + (inView ? "in " : "") + className}
        style={{ transitionDelay: inView ? delay + "ms" : "0ms" }}>
      {children}
    </As>
  );
}

/* ----------------------------------- Navbar ---------------------------------- */

/* --------------------------------- Laptop mockup --------------------------------- */
function LaptopBuild() {
  const wrapRef = useRef(null);
  const innerRef = useRef(null);
  const [step, setStep] = useState(0);
  const steps = 5;

  useEffect(() => {
    const id = setInterval(() => setStep((s) => (s + 1) % (steps + 1)), 900);
    return () => clearInterval(id);
  }, []);

  useEffect(() => {
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduced) return;
    const wrap = wrapRef.current, inner = innerRef.current;
    if (!wrap || !inner) return;
    let raf, tx = 0, ty = 0, cx = 0, cy = 0;
    const onMove = (e) => {
      const r = wrap.getBoundingClientRect();
      tx = ((e.clientX - r.left) / r.width - 0.5) * 2;
      ty = ((e.clientY - r.top) / r.height - 0.5) * 2;
    };
    const loop = () => {
      cx += (tx - cx) * 0.055; cy += (ty - cy) * 0.055;
      inner.style.transform = `rotateX(${(10 - cy * 6).toFixed(2)}deg) rotateY(${(-14 + cx * 8).toFixed(2)}deg)`;
      raf = requestAnimationFrame(loop);
    };
    window.addEventListener("mousemove", onMove);
    raf = requestAnimationFrame(loop);
    return () => { window.removeEventListener("mousemove", onMove); cancelAnimationFrame(raf); };
  }, []);

  const blocks = [
    { top: "14%", left: "8%", width: "38%", height: "10%" },
    { top: "28%", left: "8%", width: "84%", height: "22%" },
    { top: "54%", left: "8%", width: "38%", height: "30%" },
    { top: "54%", left: "50%", width: "42%", height: "30%" },
    { top: "88%", left: "8%", width: "84%", height: "6%" },
  ];

  return (
    <div ref={wrapRef} style={{ perspective: "1400px", width: "100%" }}>
      <div style={{ animation: "floatY 7s ease-in-out infinite" }}>
        <div ref={innerRef} style={{ transformStyle: "preserve-3d", transition: "transform .12s linear", position: "relative" }}>
          {/* screen */}
          <div className="card" style={{
            borderRadius: "18px 18px 6px 6px", aspectRatio: "16/10.4", overflow: "hidden", position: "relative",
            background: "linear-gradient(155deg,#17151d,#0c0b10)", boxShadow: "0 60px 100px -40px rgba(0,0,0,0.7)"
          }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "12px 16px", borderBottom: "1px solid var(--border)" }}>
              <span style={{ width: 8, height: 8, borderRadius: 99, background: "#5b5566" }} />
              <span style={{ width: 8, height: 8, borderRadius: 99, background: "#5b5566" }} />
              <span style={{ width: 8, height: 8, borderRadius: 99, background: "#5b5566" }} />
              <span className="mono" style={{ marginLeft: 10, fontSize: 10, color: "var(--ink-faint)", background: "rgba(255,255,255,0.04)", padding: "3px 10px", borderRadius: 999 }}>kairgo.studio</span>
            </div>
            <div style={{ position: "relative", height: "calc(100% - 36px)" }}>
              {blocks.map((b, i) => (
                <div key={i} style={{
                  position: "absolute", top: b.top, left: b.left, width: b.width, height: b.height,
                  borderRadius: 8, border: "1px solid var(--border-strong)",
                  background: i === 0 ? "linear-gradient(120deg,var(--violet),var(--violet-deep))" : "rgba(255,255,255,0.05)",
                  opacity: step > i ? 1 : 0, transform: step > i ? "scale(1)" : "scale(0.9)",
                  transition: "opacity .5s cubic-bezier(.16,.8,.3,1), transform .5s cubic-bezier(.16,.8,.3,1)"
                }} />
              ))}
              <div className="mono" style={{
                position: "absolute", left: 18, bottom: 10, fontSize: 9.5, letterSpacing: "0.06em", color: "var(--ink-faint)"
              }}>{step >= steps ? "BUILD COMPLETE" : "BUILDING…"}</div>
            </div>
          </div>
          {/* base */}
          <div style={{
            height: 14, margin: "0 -3%", borderRadius: "0 0 10px 10px",
            background: "linear-gradient(180deg,#232028,#131118)", boxShadow: "0 24px 40px -20px rgba(0,0,0,0.6)"
          }} />
        </div>
      </div>
    </div>
  );
}

function ClickToBuildBadge({ size = 118 }) {

    <div style={{ position: "relative", width: size, height: size, animation: "spin 9s linear infinite", flexShrink: 0 }}>
      <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size}>
        <defs>
          <path id="circlePath" d={`M ${cx},${cy} m -${r},0 a ${r},${r} 0 1,1 ${r * 2},0 a ${r},${r} 0 1,1 -${r * 2},0`} />
        </defs>
        <text fill="var(--ink-dim)" fontFamily="var(--f-mono)" fontSize="9.2" letterSpacing="1.5">
          <textPath href="#circlePath" startOffset="0%">{text}</textPath>

      </svg>
      <span style={{
        position: "absolute", top: "50%", left: "50%", transform: "translate(-50%,-50%) rotate(0deg)",
        width: 34, height: 34, borderRadius: "50%", background: "var(--violet)", display: "flex", alignItems: "center", justifyContent: "center"
      }}>
        <Icon.Play style={{ width: 13, height: 13, color: "#0b0a0e", marginLeft: 2 }} />
      </span>
    </div>
  );
}

/* --------------------------------------- Hero --------------------------------------- */

      <div className="mono" style={{

function PhoneChat() {
  const script = [
    { who: "cliente", text: "Hola, ¿tienen citas disponibles esta semana?" },
    { who: "bot", text: "¡Claro! Tengo espacio el jueves 4:00pm o viernes 11:00am. ¿Cuál prefieres?" },
    { who: "cliente", text: "El viernes está perfecto." },
    { who: "bot", text: "Listo ✔ Quedaste agendado. Te comparto la confirmación por aquí mismo." },
  ];
  const [msgs, setMsgs] = useState([]);
  const [typing, setTyping] = useState(false);
  const [draft, setDraft] = useState("");

  useEffect(() => {
    let cancelled = false;
    let i = 0;
    async function run() {
      while (!cancelled) {
        if (i >= script.length) { i = 0; setMsgs([]); await wait(900); continue; }
        const m = script[i];
        if (m.who === "bot") {
          setTyping(true);
          await wait(1100);
          if (cancelled) return;
          setTyping(false);
        }
        setDraft("");
        for (let c = 1; c <= m.text.length; c++) {
          if (cancelled) return;
          setDraft(m.text.slice(0, c));
          await wait(m.who === "cliente" ? 34 : 22);
        }
        await wait(250);
        setMsgs((prev) => [...prev, m]);
        setDraft("");
        i++;
        await wait(650);
      }
    }
    const wait = (ms) => new Promise((res) => setTimeout(res, ms));
    if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) run();
    else setMsgs(script);
    return () => { cancelled = true; };
  }, []);

  const Bubble = ({ who, text }) => (
    <div style={{
      alignSelf: who === "cliente" ? "flex-end" : "flex-start", maxWidth: "82%",
      background: who === "cliente" ? "linear-gradient(120deg,var(--violet),var(--violet-deep))" : "rgba(255,255,255,0.08)",
      color: who === "cliente" ? "#0b0a0e" : "var(--ink)",
      padding: "9px 13px", borderRadius: 14, fontSize: 12.5, lineHeight: 1.4
    }}>{text}</div>
  );

  return (
    <div style={{ position: "relative", maxWidth: 300, marginInline: "auto" }}>
      <Mascot />
      <div style={{
        position: "relative", zIndex: 1, borderRadius: 40, padding: 12,
        background: "linear-gradient(165deg,#241f30,#120f18)", border: "1px solid var(--border-strong)",
        boxShadow: "0 50px 90px -30px rgba(124,101,232,0.35)"
      }}>
        <div style={{
          borderRadius: 28, overflow: "hidden", background: "linear-gradient(180deg,#1a1622,#100d15)",
          aspectRatio: "9/17.5", display: "flex", flexDirection: "column", position: "relative"
        }}>
          <div style={{ position: "absolute", top: 8, left: "50%", transform: "translateX(-50%)", width: 60, height: 16, background: "#100d15", borderRadius: 999, zIndex: 2 }} />
          <div style={{ padding: "26px 16px 12px", borderBottom: "1px solid var(--border)", display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ width: 24, height: 24, borderRadius: "50%", background: "var(--violet)" }} />
            <div>
              <div style={{ fontSize: 11, fontWeight: 700 }}>Kairgo Assistant</div>
              <div className="mono" style={{ fontSize: 8.5, color: "var(--violet)" }}>● en línea</div>
            </div>
          </div>
          <div style={{ flex: 1, padding: "14px 12px", display: "flex", flexDirection: "column", gap: 8, overflow: "hidden" }}>
            {msgs.map((m, i) => <Bubble key={i} who={m.who} text={m.text} />)}
            {typing && (
              <div style={{ alignSelf: "flex-start", background: "rgba(255,255,255,0.08)", borderRadius: 14, padding: "10px 14px", display: "flex", gap: 4 }}>
                {[0, 1, 2].map((d) => <span key={d} style={{ width: 5, height: 5, borderRadius: "50%", background: "var(--ink-dim)", animation: `dotBounce 1.2s ease-in-out ${d * 0.15}s infinite` }} />)}
              </div>
            )}
            {draft && (
              <div style={{
                alignSelf: msgs.length % 2 === 0 && msgs.length < script.length && script[msgs.length] && script[msgs.length].who === "cliente" ? "flex-end" : "flex-start",
                maxWidth: "82%", background: "rgba(255,255,255,0.08)", padding: "9px 13px", borderRadius: 14, fontSize: 12.5, color: "var(--ink)"
              }}>{draft}<span style={{ animation: "blink 1s step-start infinite" }}>▍</span></div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

/* -------------------------------------- App -------------------------------------- */
function App() {
  const [active, setActive] = useState("inicio");
  const ratios = useRef({});
  useEffect(() => {
    const els = Array.from(document.querySelectorAll("[data-index]"));
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { ratios.current[e.target.dataset.index] = e.isIntersecting ? e.intersectionRatio : 0; });
      let best = null, bestVal = 0;
      Object.entries(ratios.current).forEach(([k, v]) => { if (v > bestVal) { bestVal = v; best = k; } });
      if (best) setActive(best);
    }, { threshold: [0, 0.25, 0.5, 0.75, 1] });
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);

  return (
    <React.Fragment>
      <Navbar />
      <IndexRail active={active} />
