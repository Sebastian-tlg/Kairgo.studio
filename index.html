<title>Kairgo Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root{
    --bg:#08070a;
    --bg-raise:#121016;
    --card:rgba(255,255,255,0.035);
    --card-strong:rgba(255,255,255,0.07);
    --border:rgba(255,255,255,0.09);
    --border-strong:rgba(255,255,255,0.22);
    --ink:#f2efe9;
    --ink-dim:#9a93a8;
    --ink-faint:#5b5566;
    --violet:#9b87f5;
    --violet-2:#7c65e8;
    --violet-glow:rgba(155,135,245,0.35);
    --electric:#5ee7ff;
    --metal:#c7c3bd;
    --radius-lg:26px;
    --radius-md:16px;
    --radius-sm:10px;
    --f-serif:'Instrument Serif',Georgia,serif;
    --f-sans:'Bricolage Grotesque',system-ui,sans-serif;
    --f-body:'Manrope',system-ui,sans-serif;
    --f-mono:'Space Mono',ui-monospace,monospace;
    --nav-h:76px;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow-x:hidden;}
  ::selection{background:var(--violet);color:#08070a;}
  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.14);border-radius:99px;}

  .container{max-width:1280px;margin:0 auto;padding:0 32px;}
  .mono{font-family:var(--f-mono);}
  .sans-black{font-family:var(--f-sans);font-weight:800;letter-spacing:-0.02em;}
  .serif-i{font-family:var(--f-serif);font-style:italic;font-weight:400;}
  .eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-faint);}
  h1,h2,h3{margin:0;line-height:1.05;font-weight:800;letter-spacing:-0.02em;font-family:var(--f-sans);}
  p{margin:0;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;}

  .btn{display:inline-flex;align-items:center;gap:9px;padding:15px 28px;border-radius:999px;font-family:var(--f-mono);font-size:12.5px;letter-spacing:0.05em;text-transform:uppercase;transition:transform .35s cubic-bezier(.2,.8,.2,1),background .3s ease,border-color .3s ease;white-space:nowrap;}
  .btn-solid{background:var(--ink);color:#08070a;}
  .btn-solid:hover{transform:translateY(-2px) scale(1.02);}
  .btn-line{border:1px solid var(--border-strong);color:var(--ink);}
  .btn-line:hover{border-color:var(--ink);transform:translateY(-2px);}
  .btn-wa{background:linear-gradient(120deg,var(--violet),var(--violet-2));color:#fff;}
  .btn-wa:hover{transform:translateY(-2px) scale(1.02);}
  .focus-ring:focus-visible{outline:2px solid var(--violet);outline-offset:3px;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);}

  canvas{display:block;}

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;}
  }

  @keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes pulseDot{0%,100%{opacity:.4;}50%{opacity:1;}}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
  @keyframes chatPop{from{opacity:0;transform:translateY(8px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}

  /* Nav */
  .navbar{position:fixed;top:0;left:0;right:0;z-index:200;height:var(--nav-h);}
  .navbar-inner{height:100%;transition:background .4s ease,border-color .4s ease,backdrop-filter .4s ease;border-bottom:1px solid transparent;}
  .navbar-inner.scrolled{background:rgba(8,7,10,0.72);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);}
  .navbar-row{height:100%;display:flex;align-items:center;justify-content:space-between;}
  .nav-links{display:flex;align-items:center;gap:34px;}
  .nav-link{font-family:var(--f-mono);font-size:12px;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink-dim);position:relative;padding:4px 0;transition:color .25s ease;}
  .nav-link:hover{color:var(--ink);}
  @media (max-width:820px){ .nav-links-desktop{display:none !important;} }

  /* Section index label */
  .section-idx{font-family:var(--f-mono);font-size:11.5px;letter-spacing:0.1em;color:var(--ink-faint);margin-bottom:18px;text-transform:uppercase;}

  /* Scroll progress bar */
  .scroll-bar{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--violet),var(--electric));z-index:300;transform-origin:0 50%;}

  /* Magnetic cursor dot */
  .cursor-dot{position:fixed;top:0;left:0;width:10px;height:10px;border-radius:50%;background:var(--violet);pointer-events:none;z-index:400;mix-blend-mode:screen;transform:translate(-50%,-50%);transition:opacity .3s ease;}
  @media (max-width:900px){ .cursor-dot{display:none;} }

  /* Hero scrolly track */
  .hero-track{position:relative;}
  .hero-pin{position:sticky;top:0;height:100vh;width:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#141019 0%,var(--bg) 70%);}
  .hero-canvas-wrap{position:absolute;inset:0;}
  .hero-content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;z-index:5;}
  .hero-content > *{pointer-events:auto;}
  .hero-kicker{font-family:var(--f-mono);font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:22px;display:flex;align-items:center;gap:10px;}
  .hero-title{font-size:clamp(52px,9.5vw,128px);font-family:var(--f-sans);font-weight:800;letter-spacing:-0.04em;line-height:0.92;}
  .hero-sub{margin-top:26px;font-size:clamp(15px,1.7vw,20px);color:var(--ink-dim);font-family:var(--f-body);max-width:480px;}
  .hero-cta-row{margin-top:38px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;}
  .hero-scroll-hint{position:absolute;bottom:36px;left:0;right:0;display:flex;justify-content:center;font-family:var(--f-mono);font-size:10.5px;letter-spacing:0.14em;color:var(--ink-faint);flex-direction:column;align-items:center;gap:8px;z-index:5;}

  .stage-copy{position:absolute;inset:0;pointer-events:none;z-index:6;}
  .stage-copy-inner{position:absolute;top:56%;left:0;right:0;transform:translateY(-50%);max-width:520px;padding:0 8vw;}
  @keyframes glowPulse{0%,100%{opacity:.6;transform:scale(1);}50%{opacity:1;transform:scale(1.08);}}
  .stage-copy .eyebrow{color:var(--electric);}
  .stage-copy h3{font-size:clamp(26px,4vw,44px);margin-top:14px;}
  .stage-copy p{margin-top:14px;font-size:15.5px;color:var(--ink-dim);line-height:1.7;max-width:420px;}

  /* Hook phrases (sticky scroll-scrubbed tagline carousel) */
  .hook-track{position:relative;}
  .hook-pin{position:sticky;top:0;height:100vh;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at 50% 60%,#12101a 0%,var(--bg) 72%);}
  .hook-phrase{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 8vw;}
  .hook-phrase-inner{position:relative;max-width:900px;}
  .hook-phrase-inner::before{content:"";position:absolute;inset:-70px -15%;background:radial-gradient(ellipse at 50% 55%,rgba(94,231,255,0.14),transparent 65%);z-index:-1;animation:glowPulse 5.5s ease-in-out infinite;}
  .hook-phrase h3{font-size:clamp(30px,5.6vw,64px);line-height:1.08;letter-spacing:-0.02em;}
  .hook-dots{position:absolute;bottom:44px;left:0;right:0;display:flex;justify-content:center;gap:9px;z-index:5;}
  .hook-dot{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);transition:background .3s ease,transform .3s ease;}
  .hook-dot.active{background:var(--electric);transform:scale(1.5);}

  /* What we build */
  .wwb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:48px;}
  @media (max-width:980px){ .wwb-grid{grid-template-columns:1fr;} }
  .wwb-card{position:relative;border-radius:var(--radius-lg);border:1px solid var(--border);background:linear-gradient(160deg,rgba(255,255,255,0.05),rgba(255,255,255,0.01));overflow:hidden;height:420px;transition:border-color .35s ease,transform .35s cubic-bezier(.2,.8,.2,1);}
  .wwb-card:hover{border-color:var(--border-strong);transform:translateY(-6px);}
  .wwb-canvas-wrap{position:absolute;inset:0;}
  .wwb-label{position:absolute;left:0;right:0;bottom:0;padding:26px;z-index:3;background:linear-gradient(to top,rgba(8,7,10,0.92),rgba(8,7,10,0));pointer-events:none;}
  .wwb-num{font-family:var(--f-mono);font-size:12px;color:var(--electric);}
  .wwb-name{margin-top:8px;font-size:22px;}
  .wwb-desc{margin-top:8px;font-size:13.5px;color:var(--ink-dim);line-height:1.5;max-width:280px;}

  /* Kairgo difference */
  .diff-section{position:relative;padding:100px 0;}
  .diff-stage{position:relative;height:80vh;min-height:560px;}
  .diff-canvas-wrap{position:absolute;inset:0;}
  .diff-node{position:absolute;font-family:var(--f-mono);font-size:13px;letter-spacing:0.08em;text-transform:uppercase;padding:10px 18px;border-radius:999px;border:1px solid var(--border-strong);background:rgba(8,7,10,0.55);backdrop-filter:blur(6px);opacity:0;transform:scale(0.6);white-space:nowrap;}
  .diff-lines{position:absolute;inset:0;pointer-events:none;}

  /* Case study */
  .case-section{padding:100px 0;border-top:1px solid var(--border);}
  .case-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;margin-top:48px;}
  @media (max-width:920px){ .case-grid{grid-template-columns:1fr;} }
  .device-stage{perspective:1600px;display:flex;justify-content:center;}
  .device{position:relative;width:100%;max-width:440px;aspect-ratio:9/16;border-radius:34px;border:1px solid var(--border-strong);background:linear-gradient(160deg,#161219,#0a0910);box-shadow:0 40px 100px -20px rgba(0,0,0,0.7),inset 0 0 0 1px rgba(255,255,255,0.03);transform-style:preserve-3d;overflow:hidden;transition:transform .1s ease-out;}
  .device-screen{position:absolute;inset:14px;border-radius:22px;overflow:hidden;background:#0b0a0f;border:1px solid var(--border);}
  .device-glare{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,0.10) 0%,rgba(255,255,255,0) 30%);pointer-events:none;}

  /* Pricing */
  .pricing-section{padding:100px 0 130px;border-top:1px solid var(--border);}
  .pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:48px;perspective:1400px;}
  @media (max-width:980px){ .pricing-grid{grid-template-columns:1fr;} }
  .price-card{position:relative;border-radius:var(--radius-lg);border:1px solid var(--border);background:linear-gradient(165deg,rgba(255,255,255,0.05),rgba(255,255,255,0.01));padding:36px 30px;transform-style:preserve-3d;transition:border-color .3s ease,background .3s ease;}
  .price-card.highlight{border-color:rgba(155,135,245,0.45);background:linear-gradient(165deg,rgba(155,135,245,0.14),rgba(155,135,245,0.02));}
  .price-tag{font-family:var(--f-mono);font-size:11px;color:var(--electric);letter-spacing:0.08em;text-transform:uppercase;}
  .price-name{margin-top:14px;font-size:24px;}
  .price-desc{margin-top:10px;font-size:13.5px;color:var(--ink-dim);line-height:1.6;min-height:58px;}
  .price-amount{margin-top:22px;font-family:var(--f-mono);font-size:34px;font-weight:700;}
  .price-maint{overflow:hidden;transition:max-height .35s ease,opacity .3s ease;max-height:0;opacity:0;}
  .price-maint.show{max-height:30px;opacity:1;}
  .price-maint-text{margin-top:6px;font-family:var(--f-mono);font-size:12px;color:var(--ink-faint);}
  .price-cta{margin-top:26px;width:100%;justify-content:center;}
  .mens-toggle{display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;border:1px solid var(--border-strong);font-family:var(--f-mono);font-size:11px;letter-spacing:0.05em;text-transform:uppercase;cursor:pointer;}

  /* Final CTA */
  .final-section{position:relative;padding:0;border-top:1px solid var(--border);}
  .final-pin{position:relative;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .final-canvas-wrap{position:absolute;inset:0;}
  .final-content{position:relative;z-index:5;text-align:center;padding:0 24px;}
  .final-title{font-size:clamp(32px,5.6vw,68px);max-width:900px;margin:0 auto;line-height:1.08;}
  .final-cta-row{margin-top:40px;display:flex;justify-content:center;}

  /* Footer */
  footer{border-top:1px solid var(--border);padding:56px 0 34px;}
  .footer-row{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:24px;}

  .reveal{opacity:0;transform:translateY(28px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1);}
  .reveal.in{opacity:1;transform:translateY(0);}

  /* Mobile nav drawer */
  .mobile-menu-btn{display:none;}
  @media (max-width:820px){ .mobile-menu-btn{display:flex !important;} }
  .mobile-drawer{position:fixed;inset:0;z-index:250;background:rgba(8,7,10,0.98);backdrop-filter:blur(10px);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:28px;opacity:0;pointer-events:none;transition:opacity .3s ease;}
  .mobile-drawer.open{opacity:1;pointer-events:auto;}
  .mobile-drawer a{font-family:var(--f-sans);font-weight:700;font-size:28px;letter-spacing:-0.02em;}
  .mobile-drawer-close{position:absolute;top:24px;right:24px;}

  /* Compact services grid */
  .svc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:44px;perspective:1200px;}
  @media (max-width:980px){ .svc-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .svc-grid{grid-template-columns:1fr;} }
  .svc-card{position:relative;padding:30px 24px 26px;border-radius:var(--radius-md);border:1px solid var(--border);background:linear-gradient(160deg,rgba(255,255,255,0.05),rgba(255,255,255,0.008));overflow:hidden;transition:border-color .35s ease,transform .1s ease-out;transform-style:preserve-3d;}
  .svc-card::before{content:"";position:absolute;inset:0;background:radial-gradient(240px circle at var(--mx,50%) var(--my,0%),rgba(155,135,245,0.16),transparent 65%);opacity:0;transition:opacity .4s ease;pointer-events:none;}
  .svc-card:hover{border-color:var(--border-strong);}
  .svc-card:hover::before{opacity:1;}
  .svc-icon{position:relative;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(155,135,245,0.14);color:var(--electric);margin-bottom:20px;animation:svcFloat 4.5s ease-in-out infinite;box-shadow:0 0 0 1px rgba(255,255,255,0.05);}
  .svc-icon::after{content:"";position:absolute;inset:-6px;border-radius:16px;border:1px solid rgba(155,135,245,0.35);animation:svcRing 3.2s ease-in-out infinite;}
  @keyframes svcFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  @keyframes svcRing{0%,100%{opacity:.15;transform:scale(1);}50%{opacity:.6;transform:scale(1.12);}}
  .svc-name{font-size:16.5px;font-weight:700;}
  .svc-desc{margin-top:8px;font-size:12.8px;color:var(--ink-dim);line-height:1.55;}
  .svc-progress{margin-top:18px;height:2px;border-radius:2px;background:rgba(255,255,255,0.07);overflow:hidden;}
  .svc-progress span{display:block;height:100%;width:38%;background:linear-gradient(90deg,var(--violet),var(--electric));animation:svcTravel 2.6s ease-in-out infinite;}
  @keyframes svcTravel{0%{transform:translateX(-100%);}100%{transform:translateX(280%);}}

  /* Feature experience sections (Automatizaciones / Recepcionista) */
  .exp-section{padding:100px 0;border-top:1px solid var(--border);overflow:hidden;}
  .exp-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;margin-top:40px;}
  @media (max-width:920px){ .exp-grid{grid-template-columns:1fr;gap:34px;} }
  .exp-grid.reverse .exp-visual{order:-1;}
  @media (max-width:920px){ .exp-grid.reverse .exp-visual{order:0;} }
  .exp-visual-frame{position:relative;height:380px;border-radius:var(--radius-lg);border:1px solid var(--border);background:linear-gradient(160deg,rgba(255,255,255,0.045),rgba(255,255,255,0.008));overflow:hidden;}
  @media (max-width:560px){ .exp-visual-frame{height:300px;} }
  .exp-visual-frame.glow-cyan{box-shadow:inset 0 0 60px -10px rgba(94,231,255,0.16),inset 0 0 1px 1px rgba(94,231,255,0.06);}
  .exp-visual-frame.glow-cyan::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(94,231,255,0.1),transparent 62%);pointer-events:none;}
  .exp-flow{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;}
  .exp-chip{font-family:var(--f-mono);font-size:11px;letter-spacing:0.05em;text-transform:uppercase;padding:8px 14px;border-radius:999px;border:1px solid var(--border-strong);color:var(--ink-dim);display:flex;align-items:center;gap:8px;}
  .exp-chip .dot{width:5px;height:5px;border-radius:99px;background:var(--electric);}

  /* Recepcionista call mock */
  .call-mock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;}
  .call-avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(140deg,var(--violet),var(--violet-2));display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px rgba(155,135,245,0.12);}
  .call-status{font-family:var(--f-mono);font-size:11.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--electric);}
  .call-waveform{display:flex;align-items:flex-end;gap:3px;height:46px;}
  .call-bar{width:4px;border-radius:3px;background:linear-gradient(180deg,var(--electric),var(--violet));animation:waveBar 1.1s ease-in-out infinite;}
  @keyframes waveBar{0%,100%{height:8px;}50%{height:42px;}}
  .call-transcript{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-dim);min-height:18px;text-align:center;max-width:260px;}

  /* Website build experience */
  .webbuild-section{border-top:1px solid var(--border);overflow:visible;}
  .webbuild-pin{position:sticky;top:0;min-height:100vh;display:flex;align-items:center;padding:100px 0;}
  .webbuild-inner{display:grid;grid-template-columns:0.8fr 1.1fr;gap:50px;align-items:center;width:100%;}
  @media (max-width:960px){ .webbuild-inner{grid-template-columns:1fr;} }
  .browser-mock{border-radius:16px;border:1px solid var(--border-strong);background:#0c0a11;overflow:hidden;box-shadow:0 40px 90px -30px rgba(0,0,0,0.7);}
  .browser-bar{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);background:#100d15;}
  .browser-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,0.16);}
  .browser-url{margin-left:10px;flex:1;height:20px;border-radius:6px;background:rgba(255,255,255,0.05);font-family:var(--f-mono);font-size:10px;color:var(--ink-faint);display:flex;align-items:center;padding:0 10px;}
  .browser-body{position:relative;padding:20px;min-height:320px;display:flex;flex-direction:column;gap:14px;overflow:hidden;}
  .wf-layer{opacity:0;transition:opacity .5s ease,transform .55s cubic-bezier(.2,.8,.2,1);}
  .wf-layer.in{opacity:1;transform:none !important;}
  .wf-layer.from-left{transform:translateX(-26px);}
  .wf-layer.scale-in{transform:scale(.82);}
  .wf-layer.from-bottom{transform:translateY(20px);}
  .wf-layer.pop{transform:translateY(16px) scale(.88);transition:opacity .4s ease,transform .55s cubic-bezier(.34,1.56,.64,1);}
  .wf-nav-row{display:flex;gap:8px;}
  .wf-nav-pill{height:9px;width:40px;border-radius:5px;background:rgba(255,255,255,0.09);}
  .wf-hero-block{height:70px;border-radius:10px;background:linear-gradient(120deg,rgba(155,135,245,0.32),rgba(94,231,255,0.18),rgba(155,135,245,0.32));background-size:200% 100%;animation:heroSheen 3.5s linear infinite;}
  @keyframes heroSheen{0%{background-position:0% 0%;}100%{background-position:200% 0%;}}
  .wf-img-row{display:flex;gap:10px;}
  .wf-img{flex:1;height:64px;border-radius:9px;background:rgba(255,255,255,0.06);border:1px solid var(--border);transition:opacity .5s ease,transform .55s cubic-bezier(.2,.8,.2,1);}
  .wf-btn-row{display:flex;gap:8px;}
  .wf-btn{height:26px;width:88px;border-radius:999px;background:rgba(255,255,255,0.08);}
  .wf-btn.primary{background:linear-gradient(120deg,var(--violet),var(--violet-2));}
  .wf-card-row{display:flex;gap:10px;}

<script>
  // Global cursor dot + scroll progress bar (vanilla, cheap, runs regardless of React tree)
  (function(){
    var dot = document.getElementById('cursordot');
    var bar = document.getElementById('scrollbar');
    var mx = 0, my = 0, dx = 0, dy = 0;
    window.addEventListener('pointermove', function(e){ mx = e.clientX; my = e.clientY; });
    function raf(){
      dx += (mx - dx) * 0.2;
      dy += (my - dy) * 0.2;
      if(dot){ dot.style.transform = 'translate(' + dx + 'px,' + dy + 'px) translate(-50%,-50%)'; }
      var h = document.documentElement;
      var scrollTop = h.scrollTop || document.body.scrollTop;
      var height = h.scrollHeight - h.clientHeight;
      var p = height > 0 ? scrollTop / height : 0;
      if(bar){ bar.style.width = (p * 100) + '%'; }
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);
  })();
</script>

/* ============================= Reveal (IO fade-up) ============================= */
function Reveal({ children, delay = 0, as: As = "div", ...rest }) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (prefersReduced()) { setInView(true); return; }
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { setInView(true); io.unobserve(el); } });
    }, { threshold: 0.15 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return (
    <As ref={ref} className={"reveal" + (inView ? " in" : "")} style={{ transitionDelay: delay + "ms" }} {...rest}>
      {children}
    </As>
  );
}

/* ============================= WebGL support guard ============================= */
function webglAvailable() {

    return !!(window.WebGLRenderingContext && (c.getContext("webgl") || c.getContext("experimental-webgl")));

}

/* ============================= Three.js: shared base scene ============================= */
class BaseScene {
  constructor(canvas, opts = {}) {
    this.canvas = canvas;
    this.opts = opts;
    this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    this.camera.position.set(0, 0, 6);
    this.clock = new THREE.Clock();
    this.mouse = { x: 0, y: 0 };
    this.mouseLerp = { x: 0, y: 0 };
    this.progress = 0;
    this.visible = true;
    this.raf = null;
    this.reduced = prefersReduced();
    this._build();
    this._raf = this._raf.bind(this);
  }
  setMouse(x, y) { this.mouse.x = x; this.mouse.y = y; }
  setProgress(p) { this.progress = p; }
  setVisible(v) { this.visible = v; }
  setSize(w, h) {
    this.renderer.setSize(w, h, false);
    this.camera.aspect = w / Math.max(h, 1);
    this.camera.updateProjectionMatrix();
  }
  start() { if (!this.raf) this.raf = requestAnimationFrame(this._raf); }
  stop() { if (this.raf) { cancelAnimationFrame(this.raf); this.raf = null; } }
  _raf() {
    this.raf = requestAnimationFrame(this._raf);
    if (!this.visible) return;
    const dt = Math.min(this.clock.getDelta(), 0.05);
    this.mouseLerp.x = lerp(this.mouseLerp.x, this.mouse.x, 0.06);
    this.mouseLerp.y = lerp(this.mouseLerp.y, this.mouse.y, 0.06);
    this._update(dt);
    this.renderer.render(this.scene, this.camera);
  }
  _build() {}
  _update(dt) {}
  dispose() {
    this.stop();
    this.scene.traverse((obj) => {
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        if (Array.isArray(obj.material)) obj.material.forEach((m) => m.dispose());
        else obj.material.dispose();
      }
    });
    this.renderer.dispose();
  }
}

/* ============================= Core object (hero / difference / final CTA) ============================= */
function makeParticleField(count, radius, color, size) {
  const positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = radius * (0.6 + Math.random() * 0.6);
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = r * Math.cos(phi);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({ color, size, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true });
  return new THREE.Points(geo, mat);
}

class CoreObjectScene extends BaseScene {
  _build() {
    this.scene.fog = new THREE.FogExp2(0x08070a, 0.045);

    this.group = new THREE.Group();
    this.scene.add(this.group);

    const detailReduce = this.opts.lowDetail;

    const outerGeo = new THREE.IcosahedronGeometry(1.7, detailReduce ? 0 : 1);
    const outerMat = new THREE.MeshBasicMaterial({ color: 0x9b87f5, wireframe: true, transparent: true, opacity: 0.55 });
    this.outer = new THREE.Mesh(outerGeo, outerMat);
    this.group.add(this.outer);

    const innerGeo = new THREE.IcosahedronGeometry(1.05, 0);
    const innerMat = new THREE.MeshStandardMaterial({ color: 0xc7c3bd, metalness: 0.9, roughness: 0.18, emissive: 0x2d2450, emissiveIntensity: 0.6 });
    this.inner = new THREE.Mesh(innerGeo, innerMat);
    this.group.add(this.inner);

    this.particles = makeParticleField(this.opts.particleCount || (detailReduce ? 200 : 500), 3.2, 0x5ee7ff, 0.035);
    this.group.add(this.particles);

    this.ambient = new THREE.AmbientLight(0x554466, 0.6);
    this.scene.add(this.ambient);

    this.keyLight = new THREE.PointLight(0x9b87f5, 6, 20);
    this.keyLight.position.set(3, 2, 4);
    this.scene.add(this.keyLight);

    this.rimLight = new THREE.PointLight(0x5ee7ff, 4, 20);
    this.rimLight.position.set(-3, -2, -3);
    this.scene.add(this.rimLight);

    this.baseCameraZ = this.opts.cameraZ || 6;
    this.camera.position.z = this.baseCameraZ;
    this.baseScale = this.opts.scale != null ? this.opts.scale : 1;
  }
  _update(dt) {
    const t = this.clock.elapsedTime;
    const p = this.progress;
    const speed = this.reduced ? 0.05 : (0.18 + p * 0.5);
    this.group.rotation.y += dt * speed;
    this.group.rotation.x = Math.sin(t * 0.15) * 0.15 + this.mouseLerp.y * 0.3;
    this.group.rotation.y += this.mouseLerp.x * dt * 0.4;

    const scale = (1 + p * 0.35 + Math.sin(t * 0.6) * 0.02) * this.baseScale;
    this.group.scale.setScalar(scale);

    this.camera.position.z = this.baseCameraZ - p * (this.opts.zoomAmount || 3.2);
    this.camera.position.x = lerp(this.camera.position.x, this.mouseLerp.x * 0.5, 0.08);
    this.camera.position.y = lerp(this.camera.position.y, -this.mouseLerp.y * 0.3, 0.08);
    this.camera.lookAt(0, 0, 0);

    const hue = lerp(0.72, 0.52, clamp(p, 0, 1));
    this.inner.material.emissiveIntensity = 0.5 + p * 0.9;
    const c = new THREE.Color().setHSL(hue, 0.65, 0.62);
    this.outer.material.color.copy(c);
    this.rimLight.color.copy(c);

    this.particles.rotation.y -= dt * 0.04;
    this.particles.material.opacity = 0.5 + p * 0.35;

    this.keyLight.position.x = Math.sin(t * 0.4) * 3.2;
    this.keyLight.position.z = Math.cos(t * 0.4) * 3.2;
  }
}

/* ============================= Mini scenes for "What We Build" cards ============================= */
class MiniScene extends BaseScene {
  setHover(v) { this._hoverTarget = v ? 1 : 0; }
  _build() {
    this._hoverTarget = 0;
    this.hover = 0;
    this.group = new THREE.Group();
    this.scene.add(this.group);
    this.scene.fog = new THREE.FogExp2(0x08070a, 0.06);
    this.ambient = new THREE.AmbientLight(0x554466, 0.7);
    this.scene.add(this.ambient);
    this.key = new THREE.PointLight(0x9b87f5, 5, 16);
    this.key.position.set(2, 2, 3);
    this.scene.add(this.key);
    this.rim = new THREE.PointLight(0x5ee7ff, 3, 16);
    this.rim.position.set(-2, -1, -2);
    this.scene.add(this.rim);
    this.camera.position.set(0, 0, 5);

    const variant = this.opts.variant;
    if (variant === "web") this._buildWeb();
    else if (variant === "bot") this._buildBot();
    else this._buildExp();
  }
  _panelMat(color, opacity) {
    return new THREE.MeshStandardMaterial({ color, metalness: 0.7, roughness: 0.3, transparent: true, opacity, side: THREE.DoubleSide });
  }
  _buildWeb() {
    this.mainPlane = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 1.4), this._panelMat(0xc7c3bd, 0.9));
    this.group.add(this.mainPlane);
    this.floaters = [];
    const specs = [[0.9, 0.35, 1.1, -0.5, 0.4], [-1.1, -0.55, 0.7, 0.7, -0.3], [0.6, 0.7, -0.9, -0.2, 0.6]];
    specs.forEach(([w, h, x, y, z]) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), this._panelMat(0x9b87f5, 0.55));
      m.position.set(x, y, z);
      this.group.add(m);
      this.floaters.push(m);
    });
    this.wire = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(2.2, 1.4)), new THREE.LineBasicMaterial({ color: 0x5ee7ff, transparent: true, opacity: 0.6 }));
    this.wire.position.z = 0.02;
    this.group.add(this.wire);
  }
  _buildBot() {
    // Faceted digital-crystal core: low-poly flat-shaded gem with an intense cyan inner glow,
    // wrapped in a slowly counter-rotating wire lattice for extra depth/complexity.
    this.core = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.5, 0),
      new THREE.MeshStandardMaterial({ color: 0x0e0c14, metalness: 1, roughness: 0.12, emissive: 0x5ee7ff, emissiveIntensity: 1.5, flatShading: true })
    );
    this.group.add(this.core);
    this.coreInner = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.26, 0),
      new THREE.MeshBasicMaterial({ color: 0x5ee7ff, transparent: true, opacity: 0.85 })
    );
    this.group.add(this.coreInner);
    this.coreWire = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.74, 1),
      new THREE.MeshBasicMaterial({ color: 0x9b87f5, wireframe: true, transparent: true, opacity: 0.35 })
    );
    this.group.add(this.coreWire);

    this.nodes = [];
    const n = 8;
    const lineGeo = new THREE.BufferGeometry();
    const linePositions = new Float32Array(n * 2 * 3);
    const nodeColors = [0x5ee7ff, 0x9b87f5];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const r = 1.35 + (i % 3) * 0.16;
      const x = Math.cos(a) * r, y = Math.sin(a * 1.3) * r * 0.62, z = Math.sin(a * 2 + i) * 0.9;
      const color = nodeColors[i % 2];
      const node = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 10), new THREE.MeshBasicMaterial({ color }));
      node.position.set(x, y, z);
      node.userData.base = { x, y, z, phase: Math.random() * Math.PI * 2 };
      this.group.add(node);
      const halo = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 10), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.16, blending: THREE.AdditiveBlending, depthWrite: false }));
      node.add(halo);
      this.nodes.push(node);
    }
    this.lineGeo = lineGeo;
    this.lineGeo.setAttribute("position", new THREE.BufferAttribute(linePositions, 3));
    this.lineMesh = new THREE.LineSegments(this.lineGeo, new THREE.LineBasicMaterial({ color: 0x5ee7ff, transparent: true, opacity: 0.28 }));
    this.group.add(this.lineMesh);

    // Data pulses: small bright points that travel back and forth along each filament,
    // simulating live routing of messages/leads/appointments through the core.
    const pulseGeo = new THREE.BufferGeometry();
    pulseGeo.setAttribute("position", new THREE.Float32BufferAttribute(new Float32Array(n * 3), 3));
    this.pulseGeo = pulseGeo;
    this.pulses = new THREE.Points(pulseGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.07, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true }));
    this.group.add(this.pulses);
  }
  _buildExp() {
    this.pieces = [];
    const geos = [new THREE.TetrahedronGeometry(0.5), new THREE.OctahedronGeometry(0.4), new THREE.IcosahedronGeometry(0.35, 0), new THREE.TetrahedronGeometry(0.3)];
    const positions = [[0, 0, 0], [1.1, 0.5, -0.4], [-1, -0.4, 0.3], [0.3, -0.9, 0.6]];
    geos.forEach((g, i) => {
      const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0xc7c3bd, metalness: 0.75, roughness: 0.25, emissive: 0x231b3d, emissiveIntensity: 0.5 }));
      m.position.set(...positions[i]);
      this.group.add(m);
      this.pieces.push(m);
    });
    const connGeo = new THREE.BufferGeometry();
    const pts = [];
    for (let i = 1; i < positions.length; i++) { pts.push(...positions[0], ...positions[i]); }
    connGeo.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
    this.connLines = new THREE.LineSegments(connGeo, new THREE.LineBasicMaterial({ color: 0x5ee7ff, transparent: true, opacity: 0.5 }));
    this.group.add(this.connLines);
  }
  _update(dt) {
    this.hover = lerp(this.hover, this._hoverTarget, 0.08);
    const t = this.clock.elapsedTime;
    const speed = (this.reduced ? 0.05 : 0.2) + this.hover * 0.35;
    this.group.rotation.y += dt * speed;
    this.group.rotation.x = Math.sin(t * 0.2) * 0.12 + this.mouseLerp.y * 0.25;
    this.group.position.y = Math.sin(t * 0.6) * 0.05;
    this.camera.position.x = lerp(this.camera.position.x, this.mouseLerp.x * 0.6, 0.08);
    this.camera.lookAt(0, 0, 0);

    if (this.opts.variant === "web" && this.floaters) {
      this.floaters.forEach((m, i) => {
        m.position.z += Math.sin(t * (0.5 + i * 0.2)) * 0.001 + this.hover * 0.002;
        m.material.opacity = 0.55 + this.hover * 0.35;
      });
      this.mainPlane.rotation.y = this.hover * 0.15;
    }
    if (this.opts.variant === "bot" && this.nodes) {
      this.core.material.emissiveIntensity = 1.3 + this.hover * 1.1 + Math.sin(t * 1.6) * 0.15;
      this.core.rotation.y += dt * 0.3;
      this.core.rotation.x += dt * 0.18;
      this.coreInner.rotation.y -= dt * 0.5;
      this.coreWire.rotation.y -= dt * (0.12 + this.hover * 0.2);
      this.coreWire.rotation.x += dt * 0.07;

      const positions = this.lineGeo.attributes.position.array;
      const pulsePos = this.pulseGeo.attributes.position.array;
      this.nodes.forEach((node, i) => {
        const b = node.userData.base;
        const pulse = 1 + Math.sin(t * 1.6 + i) * 0.07 + this.hover * 0.12;
        node.position.set(b.x * pulse, b.y * pulse, b.z * pulse);
        positions[i * 6] = 0; positions[i * 6 + 1] = 0; positions[i * 6 + 2] = 0;
        positions[i * 6 + 3] = node.position.x; positions[i * 6 + 4] = node.position.y; positions[i * 6 + 5] = node.position.z;

        // Pulse travels core -> node -> core, simulating data flowing both ways.
        const speed = 0.6 + this.hover * 0.5;
        const travel = (Math.sin(t * speed + b.phase) + 1) / 2;
        pulsePos[i * 3] = node.position.x * travel;
        pulsePos[i * 3 + 1] = node.position.y * travel;
        pulsePos[i * 3 + 2] = node.position.z * travel;
      });
      this.lineGeo.attributes.position.needsUpdate = true;
      this.pulseGeo.attributes.position.needsUpdate = true;
      this.lineMesh.material.opacity = 0.22 + this.hover * 0.3;
      this.pulses.material.opacity = 0.75 + this.hover * 0.25;
    }
    if (this.opts.variant === "exp" && this.pieces) {
      this.pieces.forEach((m, i) => {
        m.rotation.x += dt * (0.3 + i * 0.1);
        m.rotation.y += dt * (0.2 + i * 0.05);
        const spread = 1 + this.hover * 0.3;
        if (i > 0) { m.position.multiplyScalar(1); }
      });
      this.connLines.material.opacity = 0.35 + this.hover * 0.4;
    }
  }
}

/* ============================= Scene3D React wrapper ============================= */
function Scene3D({ factory, className, style, onReady, onHoverable }) {
  const canvasRef = useRef(null);
  const wrapRef = useRef(null);
  const sceneRef = useRef(null);
  const [supported] = useState(() => webglAvailable());

  useEffect(() => {
    if (!supported) return;
    const canvas = canvasRef.current;
    const wrap = wrapRef.current;
    if (!canvas || !wrap) return;
    let scene;
    try {
      scene = factory(canvas);
    } catch (e) {
      console.warn("Scene3D init failed", e);
      return;
    }
    sceneRef.current = scene;
    if (onReady) onReady(scene);

    const ro = new ResizeObserver((entries) => {
      for (const entry of entries) {
        const { width, height } = entry.contentRect;
        if (width > 0 && height > 0) scene.setSize(width, height);
      }
    });
    ro.observe(wrap);
    const rect0 = wrap.getBoundingClientRect();
    scene.setSize(rect0.width || 1, rect0.height || 1);

    const onMove = (e) => {
      const r = wrap.getBoundingClientRect();
      const nx = ((e.clientX - r.left) / r.width) * 2 - 1;
      const ny = ((e.clientY - r.top) / r.height) * 2 - 1;
      scene.setMouse(clamp(nx, -1, 1), clamp(ny, -1, 1));
    };
    window.addEventListener("pointermove", onMove);

    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => scene.setVisible(e.isIntersecting));
    }, { threshold: 0.01 });
    io.observe(wrap);

    if (onHoverable) {
      const enter = () => scene.setHover && scene.setHover(true);
      const leave = () => scene.setHover && scene.setHover(false);
      wrap.addEventListener("pointerenter", enter);
      wrap.addEventListener("pointerleave", leave);
      scene.start();
      return () => {
        wrap.removeEventListener("pointerenter", enter);
        wrap.removeEventListener("pointerleave", leave);
        window.removeEventListener("pointermove", onMove);
        ro.disconnect(); io.disconnect();
        scene.dispose();
      };
    }

    scene.start();
    return () => {
      window.removeEventListener("pointermove", onMove);
      ro.disconnect(); io.disconnect();
      scene.dispose();
    };
  }, [supported]);

  return (
    <div ref={wrapRef} className={className} style={style}>
      {supported && <canvas ref={canvasRef} style={{ width: "100%", height: "100%" }} />}
    </div>
  );
}

function HeroTrack() {

const CHAT_SCRIPT = [
  { from: "user", text: "hola! vi tu pagina, cuanto cuesta un chatbot?" },
  { from: "ai", text: "¡hola! 👋 depende del plan — te late que un especialista te marque hoy o esta semana para verlo bien?" },

function LiveChatScreen() {
  const [step, setStep] = useState(0);
  // step cycles: 0=empty,1=msg1,2=msg1+typing,3=msg1+msg2,4=+msg3,5=+typing,6=all,7=hold -> reset
  useEffect(() => {
    const durations = [500, 900, 1000, 900, 900, 1000, 2600, 600];
    let cancelled = false;
    let s = 0;
    const tick = () => {
      if (cancelled) return;
      setStep(s);
      const d = durations[s % durations.length];
      s = (s + 1) % 8;
      setTimeout(tick, d);
    };
    tick();
    return () => { cancelled = true; };
  }, []);
  const visible = [];
  if (step >= 1) visible.push(CHAT_SCRIPT[0]);
  const showTyping1 = step === 2;
  if (step >= 3) visible.push(CHAT_SCRIPT[1]);
  if (step >= 4) visible.push(CHAT_SCRIPT[2]);
  const showTyping2 = step === 5;
  if (step >= 6) visible.push(CHAT_SCRIPT[3]);

  return (
    <div style={{ padding: 16, height: "100%", background: "#0c0b11", display: "flex", flexDirection: "column", gap: 8, justifyContent: "flex-end" }}>
      {visible.map((m, i) => (
        <div
          key={i}
          className="mono"
          style={{
            alignSelf: m.from === "user" ? "flex-start" : "flex-end",
            maxWidth: "80%",
            padding: "9px 13px",
            borderRadius: m.from === "user" ? "14px 14px 14px 3px" : "14px 14px 3px 14px",
            background: m.from === "user" ? "var(--card-strong)" : "linear-gradient(120deg,var(--violet),var(--violet-2))",
            color: m.from === "user" ? "inherit" : "#fff",
            fontSize: 11.5,
            opacity: 0,
            animation: "chatPop .4s ease forwards",
          }}
        >
          {m.text}
        </div>
      ))}
      {(showTyping1 || showTyping2) && (
        <div className="mono" style={{ alignSelf: showTyping1 ? "flex-start" : "flex-end", padding: "9px 13px", borderRadius: 14, background: showTyping1 ? "var(--card-strong)" : "rgba(155,135,245,0.4)", fontSize: 11.5, opacity: 0, animation: "chatPop .3s ease forwards" }}>
            <span style={{ display: "inline-block", animation: "pulseDot 1.1s ease-in-out infinite" }}>•</span>
            <span style={{ display: "inline-block", animation: "pulseDot 1.1s ease-in-out .15s infinite" }}>•</span>
            <span style={{ display: "inline-block", animation: "pulseDot 1.1s ease-in-out .3s infinite" }}>•</span>
        </div>
      )}
    </div>
  );
}

function CaseStudy() {
  const deviceRef = useRef(null);
  const sectionRef = useRef(null);
  const [screenIndex, setScreenIndex] = useState(0);
  const [tilt, setTilt] = useState({ x: 0, y: 0 });

  useEffect(() => {
    const el = sectionRef.current;
    if (!el) return;
    const st = ScrollTrigger.create({
      trigger: el,
      start: "top 60%",
      end: "bottom 30%",
      scrub: 0.6,
      onUpdate: (self) => setScreenIndex(Math.min(2, Math.floor(self.progress * 3))),
    });
    return () => st.kill();
  }, []);

  const onMove = (e) => {
    const r = deviceRef.current.getBoundingClientRect();
    const nx = ((e.clientX - r.left) / r.width) * 2 - 1;
    const ny = ((e.clientY - r.top) / r.height) * 2 - 1;
    setTilt({ x: clamp(nx, -1, 1), y: clamp(ny, -1, 1) });
  };
  const onLeave = () => setTilt({ x: 0, y: 0 });

  return (
    <section className="case-section" id="work" ref={sectionRef}>
      <div className="container">
        <div className="case-grid">
          <Reveal>
            <div className="section-idx">007 — Demo</div>
